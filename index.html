<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>:: Cek Khodam ::</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="manifest" href="/Cek_Khodam/manifest.json">

<meta name="theme-color" content="#111111">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Cek Khodam">

<link rel="apple-touch-icon" href="/Cek_Khodam/icons/icon-192.png">
</head>

<body class="bg-gray-800 flex justify-center items-center min-h-screen px-4">

  <main class="w-full max-w-md bg-gray-700 border border-gray-500 p-8 rounded-2xl text-center shadow-xl">
    
    <h1 class="text-white text-4xl font-bold mb-6">Cek Khodam</h1>
    
    <div class="flex flex-col gap-4">
      <input 
        type="text"
        id="input"
        class="rounded-lg bg-gray-600 text-white p-4 text-center border border-gray-500 text-lg"
        placeholder="Masukkan Nama"
      />
      
      <button 
        id="tombol"
        class="text-white p-4 bg-blue-500 rounded-lg text-lg font-semibold hover:bg-blue-600 transition"
      >
        Cek Khodam
      </button>
    </div>

    <div class="border-b border-gray-600 my-6"></div>

    <div class="text-white text-lg">
      <h2>
        Khodam <span id="nama" class="font-semibold">Anda</span> adalah 
        <span id="hasil" class="text-blue-400 font-bold">-</span>
      </h2>
    </div>

  </main>

  <script src="script.js"></script>

</body>
</html>
